# Drop this into .github/workflows/cce.yml in any repository.
name: CCE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Option A: reusable workflow (checkout + scan + artifact upload).
  scan:
    uses: stackgenhq/cce-action/.github/workflows/scan.yml@v1
    with:
      language: AUTO
      filter: cloud
      # Leave diagnostics false unless you intentionally opt in to sending
      # unmapped method signatures to StackGen field ingest.
      diagnostics: false

