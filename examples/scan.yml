# Drop this into .github/workflows/cce.yml in any repository.
name: CCE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Option A: reusable workflow (pulls ghcr.io/stackgenhq/cce, copies cce onto PATH).
  scan:
    uses: stackgenhq/cce-action/.github/workflows/scan.yml@v1
    with:
      language: AUTO
      filter: cloud
      # Optional: lens: .cce/cloud.yaml
      # Use filter: all for custom providers such as TECH_DEBT.
      # Local lens hashes are automatic; HTTPS lenses require lens-sha256.
      # Leave diagnostics false unless you intentionally opt in to sending
      # unmapped method signatures to StackGen field ingest.
      diagnostics: false

