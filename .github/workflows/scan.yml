name: CCE scan (reusable)

# Checkout the calling repository, run stackgenhq/cce-action, and upload results.
# Diagnostics stay off unless the caller sets diagnostics: true.
on:
  workflow_call:
    inputs:
      path:
        description: Directory to scan inside the checked-out repo
        type: string
        default: "."
      language:
        description: "Language: GO, PYTHON, JAVA, JAVASCRIPT, or AUTO"
        type: string
        default: AUTO
      filter:
        description: "Result filter: cloud or all"
        type: string
        default: cloud
      diagnostics:
        description: Opt in to StackGen field diagnostics (off by default)
        type: boolean
        default: false
      lens:
        description: Workspace-relative lens YAML or HTTPS URL
        type: string
        default: ""
      lens-sha256:
        description: Expected lens file SHA-256 (required for HTTPS)
        type: string
        default: ""
      lens-required:
        description: Fail when the lens adds no unique operations
        type: boolean
        default: false
      export-policies:
        description: Export aws-iam, gcp-iam, azure-rbac, and esbom
        type: boolean
        default: true
      fail-on-empty:
        description: Fail when the scan finds zero entitlements
        type: boolean
        default: false
      log-level:
        description: cce log level
        type: string
        default: info
      scan-timeout:
        description: Wall-clock seconds allowed for the cce scan itself (0 = no limit)
        type: string
        default: "0"
      output-dir:
        description: Directory where scan artifacts are written
        type: string
        default: cce-results
      artifact-name:
        description: Name of the uploaded artifact
        type: string
        default: cce-results
      image:
        description: CCE container image (defaults to the action-tested CLI release)
        type: string
        default: ghcr.io/stackgenhq/cce:0.0.38
    outputs:
      version:
        description: Installed cce version
        value: ${{ jobs.scan.outputs.version }}
      report-path:
        description: Path to the primary scan report
        value: ${{ jobs.scan.outputs.report-path }}
      entitlement-count:
        description: Total entitlements found
        value: ${{ jobs.scan.outputs.entitlement-count }}
      lens-file-sha256:
        description: Verified local lens digest or configured remote pin
        value: ${{ jobs.scan.outputs.lens-file-sha256 }}
      lens-new-operation-count:
        description: Unique operations added by the lens when requested
        value: ${{ jobs.scan.outputs.lens-new-operation-count }}

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cce.outputs.version }}
      report-path: ${{ steps.cce.outputs.report-path }}
      entitlement-count: ${{ steps.cce.outputs.entitlement-count }}
      lens-file-sha256: ${{ steps.cce.outputs.lens-file-sha256 }}
      lens-new-operation-count: ${{ steps.cce.outputs.lens-new-operation-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Relative ./ would resolve to the *caller* repo, so pin this action repo.
      # The action pulls ghcr.io/stackgenhq/cce and copies the binary onto PATH
      # (composite actions cannot run reliably inside a job container).
      - name: Run CCE
        id: cce
        uses: stackgenhq/cce-action@v1
        with:
          path: ${{ inputs.path }}
          language: ${{ inputs.language }}
          filter: ${{ inputs.filter }}
          diagnostics: ${{ inputs.diagnostics }}
          lens: ${{ inputs.lens }}
          lens-sha256: ${{ inputs.lens-sha256 }}
          lens-required: ${{ inputs.lens-required }}
          output-dir: ${{ inputs.output-dir }}
          export-policies: ${{ inputs.export-policies }}
          fail-on-empty: ${{ inputs.fail-on-empty }}
          log-level: ${{ inputs.log-level }}
          scan-timeout: ${{ inputs.scan-timeout }}
          image: ${{ inputs.image }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.output-dir }}/*
          if-no-files-found: warn
