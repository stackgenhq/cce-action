name: CCE access request
description: Generate a code-evidenced access-request artifact for IAM/platform review.
author: StackGen

branding:
  icon: lock
  color: blue

inputs:
  path:
    description: Directory to scan (relative to the workspace). Caller should check out the repo first.
    required: false
    default: "."
  lens:
    description: Local custom lens YAML or HTTPS URL. Remote lenses require lens-sha256.
    required: false
    default: ""
  lens-sha256:
    description: Expected SHA-256 of the lens file bytes. Calculated automatically for local lenses when omitted.
    required: false
    default: ""
  service:
    description: Service name (defaults to the scanned folder name).
    required: false
    default: ""
  commit:
    description: Source commit (defaults to the checkout's git HEAD when available).
    required: false
    default: ""
  output-dir:
    description: Directory for the access-request artifact.
    required: false
    default: cce-results/access-request
  upload-artifact:
    description: Upload the access-request artifact with actions/upload-artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: cce-access-request
  image:
    description: Container image used to install the cce binary (copied onto PATH).
    required: false
    default: ghcr.io/stackgenhq/cce:0.0.38

outputs:
  version:
    description: Installed cce version.
    value: ${{ steps.install.outputs.version }}
  image:
    description: Container image used for install, or preinstalled.
    value: ${{ steps.install.outputs.image }}
  access-request-path:
    description: Path to cce-access-request.json.
    value: ${{ steps.run.outputs.access-request-path }}
  operation-count:
    description: Number of unique code-evidenced operations.
    value: ${{ steps.run.outputs.operation-count }}
  commit:
    description: Source commit recorded in the access request.
    value: ${{ steps.run.outputs.commit }}
  lens-file-sha256:
    description: SHA-256 of the custom lens file bytes, or empty for built-in rules only.
    value: ${{ steps.run.outputs.lens-file-sha256 }}

runs:
  using: composite
  steps:
    - name: Install cce
      id: install
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/../scripts/install-cce.sh"

    - name: Generate access request
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_LENS: ${{ inputs.lens }}
        INPUT_LENS_SHA256: ${{ inputs.lens-sha256 }}
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/../scripts/run-access-request.sh"

    - name: Upload access request
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn
